<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1f">
  <title>erma — session</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="conv-page">
  <header class="topbar conv-topbar">
    <a class="back" href="/" aria-label="back">←</a>
    <div class="conv-title-block">
      <span class="title" id="conv-title">session</span>
      <span class="conv-dir" id="conv-dir"></span>
    </div>
    <span class="pill conv-pill" id="conv-pill" aria-live="polite">idle</span>
    <span class="status conv-conn" id="conv-conn" title="SSE connection">·</span>
    <!-- TODO: session menu — wire up in a later PR. Until then, no menu ARIA
         roles so screen readers don't announce an interactive menu that does
         nothing. -->
    <button class="conv-menu" id="conv-menu" type="button" aria-label="session menu">⋮</button>
    <span class="counts" id="conv-badge" aria-live="polite" hidden></span>
  </header>

  <nav class="tabs segmented" role="tablist" aria-label="session views">
    <button class="tab active" role="tab" data-tab="conversation" aria-selected="true">Conversation</button>
    <button class="tab" role="tab" data-tab="terminal" aria-selected="false">Terminal</button>
  </nav>

  <section id="offline-banner" class="offline-banner" role="status" aria-live="polite" hidden>
    <span class="offline-dot" aria-hidden="true"></span>
    <span class="offline-msg" id="offline-msg"></span>
    <span class="offline-retry" id="offline-retry"></span>
  </section>

  <section id="perm-sheet" class="sheet perm-sheet" hidden aria-label="Permission request">
    <div class="sheet-head">
      <span class="sheet-label">● PERMISSION</span>
      <button id="perm-chevron" class="sheet-chevron" type="button" aria-expanded="true" aria-label="Collapse"></button>
    </div>
    <h2 class="sheet-title" id="perm-title"></h2>
    <div class="sheet-body" id="perm-body-wrap">
      <div class="sheet-preview" id="perm-preview"></div>
      <div class="sheet-choices" id="perm-choices"></div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="tab-conversation" class="tab-panel" role="tabpanel">
    <main class="conv-main">
      <button id="earlier" class="earlier" hidden>load earlier</button>
      <ol id="turns" class="turns" aria-live="polite"></ol>
      <div id="conv-empty" class="conv-empty" hidden>
        <div class="conv-empty-glyph" aria-hidden="true">&gt;_</div>
        <p class="conv-empty-title">No turns yet</p>
        <p class="conv-empty-sub">
          <span id="conv-empty-sub-lead">Claude is ready</span><span id="conv-empty-sub-in"> in </span><code class="conv-empty-dir" id="conv-empty-dir"></code>.
          Your first message starts the conversation.
        </p>
      </div>
    </main>

    <footer class="status-strip" id="status-strip" aria-live="polite">
      <span class="strip-state" id="strip-state">idle</span>
      <span class="strip-detail" id="strip-detail"></span>
      <span class="strip-elapsed" id="strip-elapsed">00:00</span>
      <button class="strip-stop" id="strip-stop" type="button" aria-label="Stop" hidden>
        <span class="strip-stop-glyph" aria-hidden="true">■</span>
        <span class="strip-stop-text">Stop</span>
      </button>
    </footer>

    <footer class="composer composer--empty" id="composer">
      <p id="send-warn" class="send-warn" hidden></p>
      <div class="replybox">
        <div class="replyfield">
          <textarea id="reply" rows="1" placeholder="Message Claude…"></textarea>
          <button id="expand" class="expand" type="button" title="Toggle full-screen editor" aria-label="Toggle full-screen editor" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          </button>
        </div>
        <div class="replybtns">
          <button id="voice" class="round voice" type="button" title="Dictate (pt-BR)" aria-label="Dictate reply (pt-BR)" aria-pressed="false" hidden>
            <span aria-hidden="true">🎙</span>
          </button>
          <button id="send" class="round send" type="button" title="Send" aria-label="Send">
            <span aria-hidden="true">➤</span>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <div id="tab-terminal" class="tab-panel" role="tabpanel" hidden>
    <main class="term-main">
      <div class="term-mode-row">
        <div class="term-modes" role="radiogroup" aria-label="Terminal display mode">
          <button class="term-mode" type="button" role="radio" data-mode="wrap" aria-checked="false">Wrap</button>
          <button class="term-mode" type="button" role="radio" data-mode="pan" aria-checked="false">Pan</button>
          <button class="term-mode" type="button" role="radio" data-mode="fit" aria-checked="true">Fit</button>
        </div>
        <span class="term-status" id="term-status" aria-live="polite"></span>
      </div>
      <pre id="term-screen" class="term-screen" aria-label="terminal snapshot"></pre>
      <p id="term-empty" class="empty">loading…</p>
    </main>
    <footer class="term-keybar" role="toolbar" aria-label="terminal keys">
      <div class="term-keyrow">
        <button class="tk" data-tkey="Escape">Esc</button>
        <button class="tk" data-tkey="Tab">Tab</button>
        <button class="tk" data-tkey="Up">↑</button>
        <button class="tk" data-tkey="Down">↓</button>
        <button class="tk" data-tkey="Left">←</button>
        <button class="tk" data-tkey="Right">→</button>
        <button class="tk" data-tkey="Enter">↵</button>
        <button class="tk tk-danger" data-tkey="C-c">^C</button>
      </div>
      <div class="term-keyrow">
        <button class="tk" data-tkey="BSpace">⌫</button>
        <button class="tk" data-tkey="C-a">^A</button>
        <button class="tk" data-tkey="C-e">^E</button>
        <button class="tk" data-tkey="C-u">^U</button>
        <button class="tk" data-tkey="C-w">^W</button>
        <button class="tk" data-tkey="C-l">^L</button>
        <button class="tk" data-tkey="C-r">^R</button>
        <button class="tk tk-ghost" id="term-focus-input" type="button" aria-label="Focus message input">⌨</button>
      </div>
    </footer>
  </div>

  <script src="/markdown.js"></script>
  <script src="/conversation.js"></script>
  <script src="/terminal.js"></script>
</body>
</html>
