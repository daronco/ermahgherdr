<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1f">
  <title>erma — session</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="conv-page">
  <header class="topbar">
    <a class="back" href="/" aria-label="back">←</a>
    <span class="title" id="conv-title">session</span>
    <span class="counts" id="conv-badge" aria-live="polite"></span>
    <span class="status" id="conv-conn" title="SSE connection">·</span>
  </header>

  <section id="perm-banner" class="perm-banner" hidden>
    <div class="perm-head">Permission requested</div>
    <div class="perm-body" id="perm-body"></div>
    <div class="perm-keys">
      <button class="qk" data-key="1">1</button>
      <button class="qk" data-key="2">2</button>
      <button class="qk" data-key="3">3</button>
      <button class="qk" data-key="esc">Esc</button>
    </div>
  </section>

  <main class="conv-main">
    <ol id="turns" class="turns" aria-live="polite"></ol>
    <p id="conv-empty" class="empty" hidden>no turns yet</p>
  </main>

  <footer class="composer">
    <div class="qkbar" role="toolbar" aria-label="quick keys">
      <button class="qk" data-key="esc" title="Escape">Esc</button>
      <button class="qk" data-key="enter" title="Enter">↵</button>
      <button class="qk" data-key="1" title="Choice 1">1</button>
      <button class="qk" data-key="2" title="Choice 2">2</button>
      <button class="qk" data-key="3" title="Choice 3">3</button>
      <button class="qk danger" data-key="ctrl-c" title="Interrupt">^C</button>
    </div>
    <div class="replybox">
      <textarea id="reply" rows="2" placeholder="type a reply, Enter to send"></textarea>
      <div class="replybtns">
        <button id="voice" class="voice" title="Voice (Chrome only)" hidden>🎙</button>
        <button id="send" class="send" title="Send">Send</button>
      </div>
    </div>
  </footer>

  <script src="/conversation.js"></script>
</body>
</html>
