# Patterns that would expose the owner's own infrastructure in this public
# repo. Patterns only: listing the real values here would itself be the leak.
# Separate from the default ruleset on purpose: the default global allowlist
# suppresses some of these matches (e.g. home paths).
[[rules]]
id = "tailnet-hostname"
description = "Real Tailscale MagicDNS name (use <hostname>.<tailnet>.ts.net)"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*\.ts\.net\b'''
keywords = ["ts.net"]
[rules.allowlist]
regexTarget = "match"
regexes = ['''(?i)\b(?:laptop|host|hostname|machine)\.(?:tailnet|example)\.ts\.net\b''']

[[rules]]
id = "tailscale-ip"
description = "Tailscale CGNAT address (shared address space used by tailnets)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\b'''
keywords = ["100."]

[[rules]]
id = "personal-email"
description = "Email address outside example/noreply domains"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]
[rules.allowlist]
regexTarget = "match"
regexes = ['''@(?:example\.(?:com|org|net)|users\.noreply\.github\.com)\b''']

[[rules]]
id = "local-home-path"
description = "Absolute path into a real home directory or named mount"
regex = '''(?:/home/[a-z_][a-z0-9_-]*/|/mnt/[A-Za-z0-9_][A-Za-z0-9_.-]*/)'''
keywords = ["/home/", "/mnt/"]
[rules.allowlist]
regexTarget = "match"
regexes = ['''/home/(?:runner|user|you|me|alice|bob)/''']
