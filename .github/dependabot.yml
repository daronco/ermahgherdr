version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init/autobuild/analyze must share one version or CodeQL fails;
      # separate PRs can never pass CI on their own.
      codeql-action:
        patterns:
          - "github/codeql-action*"
